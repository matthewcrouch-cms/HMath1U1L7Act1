<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity 1: Comparing Measures</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#cbd5e1;--ac:#F56600;--cb:#7BAFD4;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2;--bar:#7BAFD4}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--bd:#475569;--ac:#ff8a33;--okb:#14532d;--nob:#7f1d1d;--bar:#5b8db5}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.4}
main{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:14px;background:var(--cb);color:#0f172a;border-bottom:5px solid #F56600;border-radius:12px;padding:10px 16px}header img{height:64px;width:auto}h1{font-size:1.4rem;margin:0}.sub{font-size:.9rem;opacity:.85}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.nav .cur{background:var(--cb);color:#0f172a;border-color:var(--cb);font-weight:700}.nav .done{border-color:var(--ok)}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--cb);border-radius:10px;padding:8px}
.item b{font-size:1.05rem}.item svg{width:100%;height:auto;display:block}
.sc{padding:14px 6px;font-size:1rem}
.q{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-top:10px}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{flex:1;min-width:90px;padding:9px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:1rem;cursor:pointer}
.opts button.sel{border-color:var(--ac);background:rgba(245,102,0,.15)}
.opts button.ok{border-color:var(--ok);background:var(--okb)}.opts button.no{border-color:var(--no);background:var(--nob)}
.fb{margin-top:8px;font-size:.9rem;color:var(--mu)}
.lb{font-size:.8rem;color:var(--mu);margin:8px 0 4px;font-weight:600}.item .opts button{padding:7px;font-size:.9rem;min-width:70px}
textarea{width:100%;margin-top:10px;border:1px solid var(--bd);border-radius:8px;padding:8px;background:var(--card);color:var(--tx);font:inherit;min-height:60px}
.act{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
.act button{padding:10px 18px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
.act button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.act button:disabled{opacity:.4;cursor:default}
.score{font-size:2rem;font-weight:700;color:var(--ac)}
</style></head><body><main>
